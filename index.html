<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Money</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#E8E6DC">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--paper:#E8E6DC;--surface:#F3F2EB;--raised:#FBFAF5;--line:#DAD8CC;--track:#DEDCCF;
 --ink:#2C302A;--muted:#7A7C70;--sage:#5E7355;--clay:#B0714F;--ready:#4A7A57;--alert:#A6503C;
 --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
 --sans:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#1E211C;--surface:#272B23;--raised:#2F3429;--line:#3A3F34;--track:#3A3F34;
 --ink:#E9E7DD;--muted:#9BA192;--sage:#93A785;--clay:#CB9270;--ready:#7BAA86;--alert:#CB7A64}}
:root[data-theme="dark"]{
 --paper:#1E211C;--surface:#272B23;--raised:#2F3429;--line:#3A3F34;--track:#3A3F34;
 --ink:#E9E7DD;--muted:#9BA192;--sage:#93A785;--clay:#CB9270;--ready:#7BAA86;--alert:#CB7A64}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.body{flex:1;padding:20px 20px calc(96px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--serif);letter-spacing:-.02em;line-height:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
 border:none;border-radius:999px;background:var(--ink);color:var(--paper);font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sage{background:var(--sage);color:var(--paper)}
.btn:focus-visible,.row:focus-visible,.nav button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
 background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:none;min-height:44px;padding:10px 4px 12px;font:inherit;
 font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button[aria-current="true"]{color:var(--sage)}
.hero{background:var(--raised);border-radius:20px;padding:24px;margin-bottom:16px}
.lab{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.amt{font-size:48px;color:var(--ink);margin-bottom:16px}
.perday{font-size:17px;color:var(--ink);margin-bottom:8px}
.perday.none{color:var(--muted)}
.pchip{font-size:13px;font-weight:500;margin-bottom:16px}
.sub{font-size:13px;color:var(--muted);margin-top:16px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.hd h2{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.hd span{font-size:17px;color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:8px;padding:8px 20px}
.row{display:flex;align-items:center;gap:12px;padding:0;width:100%;min-height:44px;border:none;background:none;border-radius:999px;text-align:left;cursor:pointer;font:inherit}
.row:hover{background:var(--surface)}
.row:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.row.late{background:color-mix(in srgb, var(--alert) 10%, transparent)}
.row.done{background:color-mix(in srgb, var(--ready) 10%, transparent)}
.row .txt{display:flex;flex-direction:column;gap:4px;flex:1}
.row .nm{font-weight:500;color:var(--ink);font-size:15px}
.row .mt{font-size:13px;color:var(--muted)}
.row .mt.ok{color:var(--ready)}
.row .mt.no{color:var(--alert)}
.row .quick-pay{flex-shrink:0;width:auto;min-height:44px;padding:0 16px;border:none;border-radius:999px;background:var(--alert);color:var(--paper);font:inherit;font-weight:600;cursor:pointer}
.stack{padding:20px;display:flex;flex-direction:column;gap:12px}
.flag{margin:16px 20px;padding:12px;background:color-mix(in srgb, var(--alert) 10%, transparent);border-radius:8px;border-left:4px solid var(--alert)}
.flag b{color:var(--alert);font-weight:600}
.flag button{color:var(--alert)}
.ok{margin:16px 20px;padding:12px;background:color-mix(in srgb, var(--ready) 10%, transparent);border-radius:8px}
.ok b{color:var(--ready);font-weight:600}
.card{background:var(--surface);border-radius:12px;margin:16px 20px;overflow:hidden}
.line{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:none}
.line.tot{background:var(--raised)}
.note{font-size:13px;color:var(--muted);margin:16px 20px}
.entry{background:var(--raised);border-radius:20px;padding:24px;margin:16px 20px;text-align:right;font-family:var(--sans);font-size:48px;font-weight:600;color:var(--ink);line-height:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:20px;margin:20px 0}
.pad button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:inherit;font-size:16px;font-weight:500;cursor:pointer;color:var(--ink)}
.pad button:active{background:color-mix(in srgb, var(--sage) 20%, var(--surface))}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
.chip{min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sage);color:var(--paper);border-color:var(--sage)}
label{display:block;padding:12px 20px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input[type="text"],input[type="number"],input[type="date"],select{display:block;width:calc(100% - 40px);margin:0 20px 12px;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:inherit;font-size:14px;color:var(--ink)}
input[type="text"]:focus,input[type="number"]:focus,input[type="date"]:focus,select:focus{outline:2px solid var(--sage);outline-offset:2px}
.sw{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 20px;gap:12px}
.sw > div{flex:1}
.sw b{display:block;font-weight:600;color:var(--ink);margin-bottom:4px}
.sw p{margin:0;font-size:13px;color:var(--muted)}
.tog{width:50px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0;position:relative;cursor:pointer;flex-shrink:0}
.tog i{position:absolute;width:26px;height:26px;background:var(--ink);border-radius:999px;top:9px;left:9px;transition:all .2s}
.tog[aria-pressed="true"] i{left:15px}
.log{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink)}
.log span{color:var(--muted)}
.log:last-child{border-bottom:none}
.err{color:var(--alert);font-size:13px;padding:0 20px;margin-top:8px}
.warn{color:var(--alert)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="clock" id="clock"></header>
  <main class="body" id="screen"></main>
  <nav class="nav" id="nav"></nav>
</div>
<script type="module" src="./app.js"></script>
<script>
/* money/sw.js and manifest.json have both been here since August; the worker
   was simply never registered, so the app has had no offline support at all. */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
<!-- ======================================================= SHELL v2 compact
     One way to move between the apps, in the same place in every one of them.

     Six of the eight apps already own the bottom of the screen with their own
     sticky nav, so a second bar down there would have meant two bars doing
     different jobs.  Instead the switcher is a single button in the header the
     app already has: the bottom stays "move around inside this app", the header
     becomes "leave it".

     It finds the header itself and borrows that app's own button styling, so
     there is no per-app markup to maintain.  The only line that changes per app
     is ACTIVE.

     Canonical copy: ~/Desktop/claude/shell/shell-compact.html
     ===================================================================== -->
<style>
.mmbtn{background:none;border:0;cursor:pointer;padding:6px;line-height:0;color:inherit;
  border-radius:9px;flex:0 0 auto}
.mmbtn:hover{background:rgba(0,0,0,.06)}
.mmbtn svg,.icon-btn svg.mmicon{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}

.mmsheet{position:fixed;inset:0;z-index:9000;display:none;align-items:flex-end;
  justify-content:center;background:rgba(20,16,12,0);transition:background .22s ease;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.mmsheet.on{display:flex}
.mmsheet.lit{background:rgba(20,16,12,.44)}
.mmsheet .in{background:#fff;color:#1a1a1f;width:100%;max-width:480px;
  border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 44px rgba(0,0,0,.26);
  transform:translateY(14px);opacity:0;transition:transform .24s cubic-bezier(.22,1,.36,1),opacity .2s ease}
.mmsheet.lit .in{transform:none;opacity:1}
@media(min-width:900px){
  .mmsheet{align-items:center}
  .mmsheet .in{border-radius:20px;max-height:82vh;box-shadow:0 24px 70px rgba(0,0,0,.32)}
}
/* the grab handle — small, but it is what makes it read as a sheet */
.mmsheet .grip{width:38px;height:4px;border-radius:99px;background:#dcdce2;margin:9px auto 2px}
.mmsheet .top{display:flex;align-items:center;gap:11px;padding:10px 18px 14px}
.mmsheet .top img{width:34px;height:34px;border-radius:9px;flex:0 0 auto;background:#fff}
.mmsheet .top b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}
.mmsheet .top span{display:block;font-size:11.5px;color:#7a7a86;font-weight:600;margin-top:1px}
.mmsheet h4{margin:14px 18px 7px;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;
  color:#a0a0aa;font-weight:800}
.mmsheet a{display:flex;align-items:center;gap:12px;padding:9px 18px;text-decoration:none;
  color:#1a1a1f;position:relative}
.mmsheet a:active{background:#f6f6f8}
@media(hover:hover){ .mmsheet a:hover{background:#f6f6f8} }
.mmsheet a .ic{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:grid;
  place-items:center;background:var(--mmtint)}
.mmsheet a .ic svg{width:18px;height:18px;stroke:var(--mmink);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.mmsheet a .tx{min-width:0;flex:1}
.mmsheet a .tx b{display:block;font-size:14px;font-weight:700;letter-spacing:-.1px}
.mmsheet a .tx span{display:block;font-size:11.5px;color:#7a7a86;font-weight:600;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmsheet a .go{color:#c4c4cc;font-size:17px;line-height:1;flex:0 0 auto}
.mmsheet a.on .tx b{color:var(--mmink)}
.mmsheet a.on .go{display:none}
.mmsheet a .here{font-size:9px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:20px;
  background:var(--mmtint);color:var(--mmink);flex:0 0 auto}
.mmsheet .close{width:100%;padding:14px;margin-top:8px;border:0;background:none;color:#7a7a86;
  font-weight:800;font-size:13px;border-top:1px solid #f0f0f3;cursor:pointer;font-family:inherit}
.mmsheet .close:hover{background:#f6f6f8}
</style>
<script>
(function(){
  var ACTIVE = "money";           /* <-- the one line that changes per app */
  var LOGO   = "/icon-192.png";
  var I = {
    home:  '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/>',
    menus: '<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    stock: '<path d="M3 8.5 12 4l9 4.5-9 4.5z"/><path d="M3 8.5v7L12 20l9-4.5v-7"/><path d="M12 13v7"/>',
    money: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M9.5 9.5h4a1.9 1.9 0 0 1 0 3.8h-3a1.9 1.9 0 0 0 0 3.8h4"/>',
    dash:  '<rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>',
    kitchen:'<path d="M4 8h16v12H4z"/><path d="M4 8l2-4h12l2 4M9 13h6"/>',
    pizza: '<path d="M12 3 3.5 20h17z"/><circle cx="10.5" cy="14" r="1.1"/><circle cx="13.6" cy="17.2" r="1.1"/>',
    wheels:'<path d="M3 16.5V8h11v8.5"/><path d="M14 11h4l3 3v2.5h-7"/><circle cx="7" cy="17.5" r="1.9"/><circle cx="17.5" cy="17.5" r="1.9"/>',
    montanas:'<circle cx="12" cy="12" r="3.8"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>'
  };
  /* the businesses' own colours, taken from the owner dashboard */
  var GROUPS = [
    ["Every day", [
      {k:"home",  u:"/",                t:"Home",             s:"Everything in one place",        c:"#17803D"},
      {k:"menus", u:"/menu-generator/", t:"This week's menu", s:"Build it, download the sheet",   c:"#B5191C"},
      {k:"stock", u:"/all-trucks/",     t:"Stock",            s:"Kitchen, Mamma Mia, Montana's",  c:"#2B4A2A"},
      {k:"money", u:"/money/",          t:"Money",            s:"What you charge, what it costs", c:"#3C7A4A"}
    ]],
    ["Each business", [
      {k:"kitchen", u:"/kitchen-stock/",            t:"Main Kitchen",        s:"The kitchen's own count",   c:"#6E1B2E"},
      {k:"pizza",   u:"/panatieris-pizza/",         t:"Panatieri's Pizza",   s:"Stock and price comparison",c:"#1E5B3A"},
      {k:"wheels",  u:"/panatieris-on-wheels/",     t:"Mamma Mia Truck",     s:"Stock on its own",          c:"#2B4A2A"},
      {k:"montanas",u:"/montanas-breakfast-truck/", t:"Montana's Breakfast", s:"Stock on its own",          c:"#7A4A1F"}
    ]],
    ["Owner", [
      {k:"dash", u:"/trucks-owner-dashboard2/", t:"Owner dashboard", s:"All four businesses at once", c:"#211E19"}
    ]]
  ];
  function tint(hex){                       /* a soft wash of the same colour */
    var n = parseInt(hex.slice(1),16);
    return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+",.10)";
  }
  function build(){
    var host = document.querySelector("header") || document.querySelector(".topbar,.app-head,.bar");
    if(!host) return;
    /* Some apps keep their buttons in a row inside the header rather than in
       the header itself.  Join whichever element actually holds them, or the
       button ends up stranded on a line of its own. */
    var existing = host.querySelector("button");
    if(existing && existing.parentElement && existing.parentElement !== host
       && host.contains(existing.parentElement)) host = existing.parentElement;
    var siblings = host.querySelector(".icon-btn");
    var b = document.createElement("button");
    b.className = siblings ? "icon-btn" : "mmbtn";
    b.type = "button"; b.title = "Other apps"; b.setAttribute("aria-label","Other apps");
    if(!siblings){
      var d = getComputedStyle(host).display;
      if(d === "flex" || d === "inline-flex") b.style.marginLeft = "auto";
      else b.style.cssFloat = "right";
    }
    b.innerHTML = '<svg class="mmicon" viewBox="0 0 24 24" aria-hidden="true">'+I.dash+'</svg>';
    host.appendChild(b);

    var rows = GROUPS.map(function(g){
      return '<h4>'+g[0]+'</h4>' + g[1].map(function(a){
        var here = a.k===ACTIVE;
        return '<a href="'+(here?"#":a.u)+'"'+(here?' class="on" aria-current="page"':'')
          + ' style="--mmink:'+a.c+';--mmtint:'+tint(a.c)+'">'
          + '<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+I[a.k]+'</svg></span>'
          + '<span class="tx"><b>'+a.t+'</b><span>'+a.s+'</span></span>'
          + (here ? '<span class="here">HERE</span>' : '<span class="go">&#8250;</span>')
          + '</a>';
      }).join("");
    }).join("");

    var sheet = document.createElement("div");
    sheet.className = "mmsheet";
    sheet.innerHTML = '<div class="in"><div class="grip"></div>'
      + '<div class="top"><img src="'+LOGO+'" alt="" width="34" height="34" '
      +   'onerror="this.remove()">'          /* no broken frame if it is missing */
      + '<span><b>Panatieri’s</b><span>Pizza &amp; Pasta</span></span></div>'
      + rows + '<button type="button" class="close">Close</button></div>';
    document.body.appendChild(sheet);

    function open(){ sheet.classList.add("on"); requestAnimationFrame(function(){ sheet.classList.add("lit"); }); }
    function shut(){ sheet.classList.remove("lit");
      setTimeout(function(){ sheet.classList.remove("on"); }, 220); }
    b.onclick = open;
    sheet.querySelector(".close").onclick = shut;
    sheet.querySelector('a.on') && (sheet.querySelector('a.on').onclick = function(e){ e.preventDefault(); shut(); });
    sheet.addEventListener("click", function(e){ if(e.target===sheet) shut(); });
    document.addEventListener("keydown", function(e){ if(e.key==="Escape" && sheet.classList.contains("on")) shut(); });
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", build);
  else build();
})();
</script>
<!-- =================================================== END SHELL v2 compact -->

</body>
</html>
